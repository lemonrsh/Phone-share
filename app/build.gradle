apply plugin: 'com.android.application'

android {
    namespace 'org.las2mile.scrcpy'
    compileSdk 36

    defaultConfig {
        applicationId "org.las2mile.scrcpy"
        minSdk 21
        targetSdk 36
        versionCode 23
        versionName "5.0.1-r13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Two editions from the same source:
    //  - standard:    connect to and control other phones (IP address). No Cloudflare.
    //  - cloudflared: also "Share this phone over the internet" with a bundled cloudflared
    //                 (src/cloudflared: binaries, ShareService declaration, share-code UI).
    // Both use the same application id and signing key, so either one installs over the other.
    flavorDimensions.add('edition')
    productFlavors {
        standard {
            dimension = 'edition'
        }
        cloudflared {
            dimension = 'edition'
            versionNameSuffix = '-cloudflared'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // A fixed debug key (committed on purpose, it protects nothing) so that every released
    // debug APK has the same signature: updates install over the old version and keep the
    // saved settings instead of requiring an uninstall.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // cloudflared (cloudflared edition) is shipped as src/cloudflared/jniLibs/<abi>/libcloudflared.so, built for
    // Android by CI. Legacy packaging makes Android extract it to the native-library folder,
    // the only app folder it may be executed from. It is a stripped Go program: do not strip it.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols.add('**/libcloudflared.so')
            keepDebugSymbols.add('**/libgoprobe.so')
        }
    }

    sourceSets {
        debug {
            assets.srcDir "$buildDir/generated/scrcpyServerAssets/debug"
        }
        release {
            assets.srcDir "$buildDir/generated/scrcpyServerAssets/release"
        }
    }
}

// Package the server as scrcpy-server.jar: only the classes*.dex of the server APK, deflated.
// app_process loads the dex straight from the zip; the APK's resources, manifest and signature
// files are not needed, and a smaller file uploads much faster (Cloudflare tunnel, slow Wi-Fi).
['Debug', 'Release'].each { variant ->
    def lower = variant.toLowerCase()
    def apk = lower == 'debug' ? 'server-debug.apk' : 'server-release-unsigned.apk'
    tasks.register("copyScrcpyServer${variant}", Zip) {
        dependsOn ":server:assemble${variant}"
        from(zipTree("$rootDir/server/build/outputs/apk/${lower}/${apk}")) {
            include 'classes*.dex'
        }
        archiveFileName = 'scrcpy-server.jar'
        destinationDirectory = file("$buildDir/generated/scrcpyServerAssets/${lower}")
        entryCompression = ZipEntryCompression.DEFLATED
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        doLast {
            def jar = new File(destinationDirectory.get().asFile, 'scrcpy-server.jar')
            println "::notice title=scrcpy server size::${variant} scrcpy-server.jar is ${jar.length()} bytes"
        }
    }
}

tasks.configureEach { task ->
    if (task.name.contains('Debug') && task.name != 'copyScrcpyServerDebug') {
        task.dependsOn tasks.named('copyScrcpyServerDebug')
    } else if (task.name.contains('Release') && task.name != 'copyScrcpyServerRelease') {
        task.dependsOn tasks.named('copyScrcpyServerRelease')
    }
}

dependencies {
    implementation 'com.tananaev:adblib:1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
