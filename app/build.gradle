apply plugin: 'com.android.application'

android {
    namespace 'org.las2mile.scrcpy'
    compileSdk 36

    defaultConfig {
        applicationId "org.las2mile.scrcpy"
        minSdk 21
        targetSdk 36
        versionCode 14
        versionName "5.0.1-r9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // A fixed debug key (committed on purpose, it protects nothing) so that every released
    // debug APK has the same signature: updates install over the old version and keep the
    // saved settings instead of requiring an uninstall.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storeType 'pkcs12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        debug {
            assets.srcDir "$buildDir/generated/scrcpyServerAssets/debug"
        }
        release {
            assets.srcDir "$buildDir/generated/scrcpyServerAssets/release"
        }
    }
}

// Package the server APK as scrcpy-server.jar. app_process loads the classes.dex
// directly from this APK, which is the format used by upstream scrcpy releases.
tasks.register('copyScrcpyServerDebug', Copy) {
    dependsOn ':server:assembleDebug'
    from "$rootDir/server/build/outputs/apk/debug/server-debug.apk"
    into "$buildDir/generated/scrcpyServerAssets/debug"
    rename { 'scrcpy-server.jar' }
}

tasks.register('copyScrcpyServerRelease', Copy) {
    dependsOn ':server:assembleRelease'
    from "$rootDir/server/build/outputs/apk/release/server-release-unsigned.apk"
    into "$buildDir/generated/scrcpyServerAssets/release"
    rename { 'scrcpy-server.jar' }
}

tasks.configureEach { task ->
    if (task.name.contains('Debug') && task.name != 'copyScrcpyServerDebug') {
        task.dependsOn tasks.named('copyScrcpyServerDebug')
    } else if (task.name.contains('Release') && task.name != 'copyScrcpyServerRelease') {
        task.dependsOn tasks.named('copyScrcpyServerRelease')
    }
}

dependencies {
    implementation 'com.tananaev:adblib:1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
